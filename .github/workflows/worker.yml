name: Deploy Tibo Reset Edge Worker

on:
  push:
    branches:
      - main
    paths:
      - 'worker/**'
      - '.github/workflows/worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tibo-reset-edge-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Verify edge worker
        run: |
          npm test
          npm run check

      - name: Require a real KV namespace
        if: ${{ vars.CLOUDFLARE_WORKER_ENABLED == 'true' }}
        run: >-
          node -e "const fs=require('node:fs');const c=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          const id=c.kv_namespaces?.find((item)=>item.binding==='DATA_MIRROR')?.id||'';
          if(!/^[0-9a-f]{32}$/.test(id))throw new Error('DATA_MIRROR requires a real 32-character KV namespace id');"

      - name: Deploy edge worker
        if: ${{ vars.CLOUDFLARE_WORKER_ENABLED == 'true' }}
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
