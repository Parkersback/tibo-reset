name: Deploy Tibo Reset to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '7,27,47 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Synchronize public data mirror
        run: python scripts/sync_data.py --output-dir site/data --timeout 20

      - name: Require a fully fresh data mirror
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          status_path = Path("site/data/sync-status.json")
          status = json.loads(status_path.read_text(encoding="utf-8"))
          if status.get("overall_status") != "ok":
              raise SystemExit(
                  "Refusing to deploy a cached or degraded mirror: "
                  f"overall_status={status.get('overall_status')!r}"
              )
          print("Fresh-data gate passed: overall_status='ok'")
          PY

      - name: Run fast verification suite
        run: |
          python -m unittest discover -s tests -p "test_*.py"
          python tests/check_static.py
          node --check site/app.js

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
