<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img">
  <title>Tibo Reset radar mark</title>
  <defs>
    <linearGradient id="sky" x1="7" y1="5" x2="58" y2="61" gradientUnits="userSpaceOnUse">
      <stop stop-color="#182457"/>
      <stop offset="0.56" stop-color="#0b1130"/>
      <stop offset="1" stop-color="#070a1c"/>
    </linearGradient>
    <linearGradient id="weather" x1="11" y1="10" x2="53" y2="53" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8fe0ff"/>
      <stop offset="0.48" stop-color="#6889ff"/>
      <stop offset="1" stop-color="#ff7b72"/>
